<link rel="stylesheet" href="../css/style.css">
<style>
  .article-card { display: block; text-decoration: none; color: inherit; margin-bottom: 18px; }
  .article-card:hover { border-color: var(--teal); }
  .source { color: var(--ink-soft); font-size: 0.85rem; }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="container">
    <a href="../index.html" class="brand">Upright</a>
    <ul class="nav-links">
      <li><a href="camera.html">Check my posture</a></li>

      <li><a href="news.html" class="active">Articles</a></li>
      <li><a href="about.html">Our goal</a></li>
    </ul>
  </div>
</nav>

<div class="container" style="padding: 40px 24px 80px; max-width: 760px;">
  <h2>Posture & health articles</h2>
  <p>A curated reading list on posture, screen time, and neck health.</p>

  <div id="articles"></div>
</div>

<footer><div class="container">Upright — built for the Congressional App Challenge.</div></footer>

<script>
  // Curated by hand. Summaries are written in our own words, not copied
  // from the source — replace or add to this list as you find more.
  const ARTICLES = [
    {
      title: "What Is Tech Neck? Symptoms, Causes and Exercises That Can Help",
      source: "Emory Healthcare",
      summary: "A hospital-system explainer on how leaning the head forward toward a screen multiplies the effective load on the neck, with symptom checklists and PT-style prevention exercises.",
      url: "https://www.emoryhealthcare.org/stories/ortho/what-is-tech-neck-symptoms-causes-and-exercises-that-can-help",
    },
    {
      title: "Tech Neck",
      source: "ConnectSafely",
      summary: "Written for parents, this piece walks through how the forward head tilt common in kids' and teens' device habits can shift the cervical spine's load from roughly 10 lbs to as much as 60 lbs, plus what signs to watch for.",
      url: "https://connectsafely.org/tech-neck/",
    },
    {
      title: "'Tech Neck' Could Pose Health Problems in the Long Run, Experts Say",
      source: "ABC7 Los Angeles",
      summary: "A local-news piece centered on a teenager's own experience with phone-related neck pain, with two clinicians' prevention tips for reducing strain during device use.",
      url: "https://abc7.com/post/tech-neck-could-pose-health-problems-in-long-run-experts-say-/1076108/",
    },
    {
      title: "Tech Neck: Physical Therapy Exercises and Treatment for Forward Head Posture",
      source: "Physitrack",
      summary: "A physical-therapy-oriented breakdown of why forward head posture overloads specific neck muscles, citing a controlled study where combining manual therapy with retraction exercises improved both pain and posture.",
      url: "https://www.physitrack.com/insights/tech-neck-physical-therapy-exercises",
    },
  ];

  document.getElementById("articles").innerHTML = ARTICLES.map(a => `
    <a class="article-card card" href="${a.url}" target="_blank" rel="noopener">
      <h3 style="margin-bottom:4px;">${a.title}</h3>
      <div class="source">${a.source}</div>
      <p style="margin-top:8px;">${a.summary}</p>
    </a>
  `).join("");
</script>
</body>
</html>
